[package]
name = "anti-library"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Read plain text files like a book — terminal and desktop readers"
build = "build.rs"

[lib]
name = "anti_library"
path = "src/lib.rs"

[[bin]]
name = "antilib"
path = "src/bin/antilib.rs"

[[bin]]
name = "antilib-gui"
path = "src/bin/antilib-gui.rs"

[[bin]]
name = "antilib-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "antilib-qa"
path = "src/bin/qa.rs"

[dependencies]
anyhow = "1"
dirs = "5"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

# document formats
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
pdf-extract = "0.12"

# terminal reader
crossterm = "0.28"
ratatui = "0.29"

# desktop reader
eframe = { version = "0.35", default-features = false, features = [
    # Without this the window publishes no accessibility tree at all, and a
    # screen reader finds nothing in it — not a button, not a slider, not the
    # page. It is a default feature of eframe; switching the defaults off to
    # pick a renderer quietly took it away with them.
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.35"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
hypher = { version = "0.1", default-features = false, features = ["english"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
